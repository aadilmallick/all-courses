<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Three different short-video commerce routes</title><desc id="desc">Native TikTok checkout differs from external owned checkout. YouTube Shorts can use an internal related-video bridge.</desc><rect width="1200" height="570" rx="20" fill="#f2f5f7"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#426471"/></marker></defs><text x="30" y="65" font-family="sans-serif" font-size="23" font-weight="bold" fill="#143844">Native TikTok Shop</text><rect x="30" y="85" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="132.5" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Shoppable video</text><line x1="239" y1="117" x2="259" y2="117" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="85" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="367.5" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Native product tag</text><line x1="474" y1="117" x2="494" y2="117" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="85" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="602.5" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Product listing</text><line x1="709" y1="117" x2="729" y2="117" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="85" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="837.5" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">TikTok checkout</text><line x1="944" y1="117" x2="964" y2="117" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="85" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="1072.5" y="124" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Merchant delivery</text><text x="30" y="180" font-family="sans-serif" font-size="17" fill="#405763">Account and exact product must qualify. Digital goods require specific invite-only approval.</text><text x="30" y="230" font-family="sans-serif" font-size="23" font-weight="bold" fill="#143844">TikTok to an owned digital product</text><rect x="30" y="250" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="132.5" y="289" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Useful video</text><line x1="239" y1="282" x2="259" y2="282" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="250" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="367.5" y="289" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Profile website</text><line x1="474" y1="282" x2="494" y2="282" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="250" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="602.5" y="289" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Matching page</text><line x1="709" y1="282" x2="729" y2="282" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="250" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="837.5" y="289" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Owned checkout</text><line x1="944" y1="282" x2="964" y2="282" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="250" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="1072.5" y="289" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Digital delivery</text><text x="30" y="345" font-family="sans-serif" font-size="17" fill="#405763">A permitted profile website is required; the store integration does not override Shop rules.</text><text x="30" y="395" font-family="sans-serif" font-size="23" font-weight="bold" fill="#143844">YouTube tutorial route</text><rect x="30" y="415" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="132.5" y="454" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Short</text><line x1="239" y1="447" x2="259" y2="447" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="415" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="367.5" y="454" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Related own video</text><line x1="474" y1="447" x2="494" y2="447" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="415" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="602.5" y="454" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Allowed external link</text><line x1="709" y1="447" x2="729" y2="447" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="415" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="837.5" y="454" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Matching page</text><line x1="944" y1="447" x2="964" y2="447" stroke="#426471" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="415" width="205" height="65" rx="9" fill="white" stroke="#b8cbd0"/><text x="1072.5" y="454" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#143844">Checkout / delivery</text><text x="30" y="510" font-family="sans-serif" font-size="17" fill="#405763">Related-video and applicable external-link features require access; Short description URLs are not clickable.</text></svg>