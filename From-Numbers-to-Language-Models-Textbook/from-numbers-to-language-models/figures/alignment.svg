<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 255" role="img" aria-labelledby="title desc"><title id="title">Three policy identities in an alignment workflow</title><desc id="desc">The policies can start with equal weights while retaining different roles and update schedules.</desc><rect width="1100" height="255" rx="12" fill="#f0f4ed"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#316d5c"/></marker></defs><text x="22" y="34" font-family="sans-serif" font-weight="700" font-size="21" fill="#173e37">Three policy identities in an alignment workflow</text><rect x="18.0" y="60" width="341.3333333333333" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="30.0" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Reference policy</text><text x="30.0" y="119" font-family="sans-serif" font-size="15" fill="#284b40">fixed behavior baseline</text><text x="30.0" y="143" font-family="sans-serif" font-size="15" fill="#284b40">used for regularization</text><line x1="361.3333333333333" y1="123" x2="376.3333333333333" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="379.3333333333333" y="60" width="341.3333333333333" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="391.3333333333333" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Old policy</text><text x="391.3333333333333" y="119" font-family="sans-serif" font-size="15" fill="#284b40">collects this rollout</text><text x="391.3333333333333" y="143" font-family="sans-serif" font-size="15" fill="#284b40">fixed during its update</text><line x1="722.6666666666666" y1="123" x2="737.6666666666666" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="740.6666666666666" y="60" width="341.3333333333333" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="752.6666666666666" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Current policy</text><text x="752.6666666666666" y="119" font-family="sans-serif" font-size="15" fill="#284b40">parameters being optimized</text><text x="752.6666666666666" y="143" font-family="sans-serif" font-size="15" fill="#284b40">ratios or preference loss</text><text x="22" y="225" font-family="sans-serif" font-size="15" fill="#39554a">The policies can start with equal weights while retaining different roles and update schedules.</text></svg>