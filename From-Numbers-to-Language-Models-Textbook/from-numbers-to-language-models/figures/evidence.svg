<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 255" role="img" aria-labelledby="title desc"><title id="title">Evidence must survive every stage of an answer pipeline</title><desc id="desc">A valid citation ID is weaker than evidence that the cited passage supports the claim.</desc><rect width="1100" height="255" rx="12" fill="#f0f4ed"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#316d5c"/></marker></defs><text x="22" y="34" font-family="sans-serif" font-weight="700" font-size="21" fill="#173e37">Evidence must survive every stage of an answer pipeline</text><rect x="18.0" y="60" width="196.8" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="30.0" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Source</text><text x="30.0" y="119" font-family="sans-serif" font-size="15" fill="#284b40">text + date</text><text x="30.0" y="143" font-family="sans-serif" font-size="15" fill="#284b40">stable identity</text><line x1="216.8" y1="123" x2="231.8" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="234.8" y="60" width="196.8" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="246.8" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Retrieve</text><text x="246.8" y="119" font-family="sans-serif" font-size="15" fill="#284b40">candidate recall</text><text x="246.8" y="143" font-family="sans-serif" font-size="15" fill="#284b40">access constraints</text><line x1="433.6" y1="123" x2="448.6" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="451.6" y="60" width="196.8" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="463.6" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Rank</text><text x="463.6" y="119" font-family="sans-serif" font-size="15" fill="#284b40">relevance</text><text x="463.6" y="143" font-family="sans-serif" font-size="15" fill="#284b40">current context</text><line x1="650.4000000000001" y1="123" x2="665.4000000000001" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="668.4000000000001" y="60" width="196.8" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="680.4000000000001" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Select</text><text x="680.4000000000001" y="119" font-family="sans-serif" font-size="15" fill="#284b40">finite budget</text><text x="680.4000000000001" y="143" font-family="sans-serif" font-size="15" fill="#284b40">preserve exceptions</text><line x1="867.2" y1="123" x2="882.2" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="885.2" y="60" width="196.8" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="897.2" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Answer</text><text x="897.2" y="119" font-family="sans-serif" font-size="15" fill="#284b40">claim + citation</text><text x="897.2" y="143" font-family="sans-serif" font-size="15" fill="#284b40">support check</text><text x="22" y="225" font-family="sans-serif" font-size="15" fill="#39554a">A valid citation ID is weaker than evidence that the cited passage supports the claim.</text></svg>