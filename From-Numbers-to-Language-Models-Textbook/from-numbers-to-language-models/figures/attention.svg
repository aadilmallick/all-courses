<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 255" role="img" aria-labelledby="title desc"><title id="title">One attention read, with actual intermediate values</title><desc id="desc">Changing keys can change the weights; changing values with scores fixed changes content only.</desc><rect width="1100" height="255" rx="12" fill="#f0f4ed"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#316d5c"/></marker></defs><text x="22" y="34" font-family="sans-serif" font-weight="700" font-size="21" fill="#173e37">One attention read, with actual intermediate values</text><rect x="18.0" y="60" width="251.0" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="30.0" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Match</text><text x="30.0" y="119" font-family="sans-serif" font-size="15" fill="#284b40">q = (1, 0)</text><text x="30.0" y="143" font-family="sans-serif" font-size="15" fill="#284b40">raw scores = (1, 0)</text><line x1="271.0" y1="123" x2="286.0" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="289.0" y="60" width="251.0" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="301.0" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Scale</text><text x="301.0" y="119" font-family="sans-serif" font-size="15" fill="#284b40">divide by sqrt(2)</text><text x="301.0" y="143" font-family="sans-serif" font-size="15" fill="#284b40">scores = (0.7071, 0)</text><line x1="542.0" y1="123" x2="557.0" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="560.0" y="60" width="251.0" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="572.0" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Normalize</text><text x="572.0" y="119" font-family="sans-serif" font-size="15" fill="#284b40">softmax over keys</text><text x="572.0" y="143" font-family="sans-serif" font-size="15" fill="#284b40">weights = (0.6698, 0.3302)</text><line x1="813.0" y1="123" x2="828.0" y2="123" stroke="#316d5c" stroke-width="2" marker-end="url(#arrow)"/><rect x="831.0" y="60" width="251.0" height="127" rx="8" fill="white" stroke="#99b6a3"/><text x="843.0" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#173e37">Read values</text><text x="843.0" y="119" font-family="sans-serif" font-size="15" fill="#284b40">values = (2, 0), (0, 4)</text><text x="843.0" y="143" font-family="sans-serif" font-size="15" fill="#284b40">output = (1.3395, 1.3210)</text><text x="22" y="225" font-family="sans-serif" font-size="15" fill="#39554a">Changing keys can change the weights; changing values with scores fixed changes content only.</text></svg>