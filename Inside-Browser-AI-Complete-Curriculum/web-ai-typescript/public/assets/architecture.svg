<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Browser AI application boundaries</title><desc id="desc">User input enters the TypeScript application. Retrieval supplies evidence. The app selects local WebLLM, browser-managed Chrome AI, or an explicitly approved cloud server. WebMCP separately exposes validated application operations to a browser agent.</desc><rect width="1000" height="420" rx="18" fill="#10212c"/><g font-family="Segoe UI, sans-serif" text-anchor="middle" fill="#e7eef4"><text x="500" y="38" font-size="22">One application, separate responsibilities</text><g fill="#203c47" stroke="#71d6c7" stroke-width="2"><rect x="28" y="100" width="180" height="80" rx="10"/><rect x="288" y="100" width="230" height="80" rx="10"/><rect x="608" y="70" width="350" height="60" rx="10"/><rect x="608" y="160" width="350" height="60" rx="10"/><rect x="608" y="250" width="350" height="60" rx="10"/><rect x="288" y="250" width="230" height="70" rx="10"/><rect x="28" y="250" width="180" height="70" rx="10"/></g><g font-size="18"><text x="118" y="136">User input</text><text x="118" y="159" font-size="14">Question / selected text</text><text x="403" y="136">TypeScript application</text><text x="403" y="159" font-size="14">Validate · route · render</text><text x="783" y="96">WebLLM</text><text x="783" y="117" font-size="14">Application-managed local model</text><text x="783" y="186">Chrome AI</text><text x="783" y="207" font-size="14">Browser-managed model</text><text x="783" y="276">Trusted server → cloud model</text><text x="783" y="297" font-size="14">Explicit transfer policy and credentials</text><text x="403" y="280">Permitted evidence</text><text x="403" y="303" font-size="14">Retrieve before generation</text><text x="118" y="279">Browser agent</text><text x="118" y="302" font-size="14">WebMCP page tools</text></g><text x="500" y="382" font-size="16" fill="#afc4d3">Inference location does not grant document access or action authority.</text></g><g fill="none" stroke="#f6bf79" stroke-width="3"><path d="M208 140H288M518 140H560V100H608M560 140V190H608M560 190V280H608M403 250V180M208 285H268V165H288"/></g></svg>
