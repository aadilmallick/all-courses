<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Evidence path before generation</title><desc id="desc">Documents are permission filtered, ranked, and assembled with source IDs before entering a chosen model. An answer is checked against the selected evidence.</desc><rect width="1000" height="300" rx="18" fill="#10212c"/><g font-family="Segoe UI, sans-serif" text-anchor="middle" fill="#e7eef4"><text x="500" y="40" font-size="23">Evidence first, generation second</text><g fill="#203c47" stroke="#71d6c7" stroke-width="2"><rect x="20" y="88" width="165" height="85" rx="10"/><rect x="220" y="88" width="165" height="85" rx="10"/><rect x="420" y="88" width="165" height="85" rx="10"/><rect x="620" y="88" width="165" height="85" rx="10"/><rect x="820" y="88" width="160" height="85" rx="10"/></g><g font-size="17"><text x="102" y="121">Authorized scope</text><text x="102" y="149" font-size="14">Filter document access</text><text x="302" y="121">Rank passages</text><text x="302" y="149" font-size="14">Lexical / semantic</text><text x="502" y="121">Evidence bundle</text><text x="502" y="149" font-size="14">IDs · titles · text</text><text x="702" y="121">Chosen generator</text><text x="702" y="149" font-size="14">Local or explicit cloud</text><text x="900" y="121">Review answer</text><text x="900" y="149" font-size="14">Claims and citations</text></g><text x="500" y="228" font-size="17" fill="#afc4d3">No useful evidence? Abstain before generation.</text><text x="500" y="257" font-size="15" fill="#afc4d3">A valid source ID proves reference integrity; semantic support needs another check.</text></g><path d="M185 130H220M385 130H420M585 130H620M785 130H820" stroke="#f6bf79" stroke-width="3"/></svg>
