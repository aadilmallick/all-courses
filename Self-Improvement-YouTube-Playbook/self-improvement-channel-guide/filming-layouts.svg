<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Two simple filming layouts, viewed from above</title><desc id="desc">Left: a phone at eye height faces a seated speaker lit from a window to one side. Right: the same arrangement with one soft key light, a desk, and optional background lamp. Both use close speech recording and a quiet background.</desc>
