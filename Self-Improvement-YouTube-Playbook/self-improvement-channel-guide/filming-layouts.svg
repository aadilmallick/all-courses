<rect width="960" height="440" rx="14" fill="#eef0e5"/>
<g font-family="Arial,sans-serif" fill="#21352f"><text x="30" y="34" font-size="17" font-weight="bold">TOP VIEW · repeatable positions, not exact measurements</text>
<rect x="22" y="55" width="446" height="365" rx="10" fill="#fffdf6" stroke="#becdbd"/>
<rect x="490" y="55" width="446" height="365" rx="10" fill="#fffdf6" stroke="#becdbd"/>
