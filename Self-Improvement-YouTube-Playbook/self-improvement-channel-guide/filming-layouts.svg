<circle cx="246" cy="226" r="31" fill="#245d4a"/><text x="231" y="232" font-size="15" fill="white">you</text>
<path d="M246 270 L246 304" stroke="#739080" stroke-dasharray="5 5" stroke-width="2"/>
<rect x="225" y="316" width="42" height="22" rx="5" fill="#21352f"/><text x="288" y="332" font-size="14">phone</text>
<text x="72" y="386" font-size="14">Close mic · soft light · chest-up framing</text>
<rect x="523" y="157" width="45" height="45" rx="7" fill="#e6bc75" stroke="#a36337"/><text x="575" y="170" font-size="14">soft key light</text>
