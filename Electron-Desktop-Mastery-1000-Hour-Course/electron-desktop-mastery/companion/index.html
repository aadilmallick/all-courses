<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Desk — Learning Companion</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><p class="eyebrow">ELECTRON DESKTOP MASTERY</p><h1>Atlas Desk</h1>
<p>A deterministic learning demo. No model, shell, network, or workspace file operations.</p></header>
<section aria-labelledby="activity-title"><h2 id="activity-title">Activity</h2>
<ol id="events" aria-label="Run activity"></ol><p id="status" role="status">Ready</p></section>
<section id="approval" hidden aria-labelledby="approval-title"><h2 id="approval-title">Review action</h2>
<p id="proposal"></p><button id="approve" type="button">Approve</button>
<button id="deny" type="button">Deny</button></section>
<form id="composer"><label for="prompt">Message</label>
<textarea id="prompt" maxlength="4000" rows="3" required placeholder="Try: summarize the sample project"></textarea>
<div class="actions"><button id="send" type="submit">Send</button>
<button id="cancel" type="button" disabled>Stop</button></div></form>
<p id="error" role="alert"></p>
</main><script src="renderer.js"></script></body></html>
