class="small" x="410" y="337">Faithful counters and timing</text><rect class="box" x="665" y="255" width="260" height="100" rx="9"/><text x="685" y="287">USD / NVIDIA study</text><text class="small" x="685" y="315">Geometry, physics and sensors</text><text class="small" x="685" y="337">Additional fidelity needs evidence</text><path class="arrow" d="M700 185V220H507V255"/><path class="arrow" d="M700 220H795V255"/><rect class="box" x="30" y="255" width="300" height="100" rx="9"/><text x="50" y="287">Validation and review</text><text class="small" x="50" y="315">Matched inputs, error and failure cases</text><text class="small" x="50" y="337">Claims, evidence, operating limits</text><path class="arrow" d="M390 305H330"/><text class="small" x="30" y="410">Teaching architecture for Hako's role context. The company codebase was not supplied.</text></svg>
