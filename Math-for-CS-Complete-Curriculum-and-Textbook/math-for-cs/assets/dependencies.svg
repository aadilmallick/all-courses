<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" viewBox="0 0 850 300" role="img" aria-labelledby="t d"><title id="t">Prerequisite progression</title><desc id="d">Read the top row from algebra to structures, then the lower row from counting through probability to random walks.</desc><rect width="100%" height="100%" fill="#f5f7f0"/><g font-family="Arial,sans-serif" fill="#173f33" font-size="18"><rect x="20" y="25" width="250" height="90" rx="10" fill="#fffdf8" stroke="#7b9a85"/><text x="35" y="61">Algebra and language</text><text x="35" y="91" font-size="14">Chapter 01</text><rect x="300" y="25" width="250" height="90" rx="10" fill="#fffdf8" stroke="#7b9a85"/><text x="315" y="61">Logic and proof</text><text x="315" y="91" font-size="14">Chapters 02–07</text><rect x="580" y="25" width="250" height="90" rx="10" fill="#fffdf8" stroke="#7b9a85"/><text x="595" y="61">Discrete structures</text><text x="595" y="91" font-size="14">Chapters 08–11</text><rect x="20" y="175" width="250" height="90" rx="10" fill="#fffdf8" stroke="#7b9a85"/><text x="35" y="211">Counting and recurrences</text><text x="35" y="241" font-size="14">Chapters 12–14</text><rect x="300" y="175" width="250" height="90" rx="10" fill="#fffdf8" stroke="#7b9a85"/><text x="315" y="211">Probability and bounds</text><text x="315" y="241" font-size="14">Chapters 15–17</text><rect x="580" y="175" width="250" height="90" rx="10" fill="#fffdf8" stroke="#7b9a85"/><text x="595" y="211">Random walks</text><text x="595" y="241" font-size="14">Chapter 18</text><text x="280" y="75">→</text><text x="560" y="75">→</text><text x="30" y="145">↓ next row</text><text x="560" y="225">→</text><text x="280" y="225">→</text></g></svg>