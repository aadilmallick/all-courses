<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" viewBox="0 0 850 300" role="img" aria-labelledby="t d"><title id="t">Detector probability tree</title><desc id="d">One percent malicious; 99 percent benign. Flag probabilities are .90 and .05, giving joint flagged probabilities .009 and .0495.</desc><rect width="100%" height="100%" fill="#f5f7f0"/><g font-family="Arial,sans-serif" fill="#173f33" font-size="18"><g stroke="#7b9a85" stroke-width="2"><path d="M80 150L320 70M80 150L320 230M320 70L600 30M320 70L600 110M320 230L600 190M320 230L600 270"/></g><text x="10" y="145">Message</text><text x="135" y="75">.01 malicious</text><text x="135" y="240">.99 benign</text><text x="390" y="30">.90 flag</text><text x="390" y="115">.10 no flag</text><text x="390" y="185">.05 flag</text><text x="390" y="280">.95 no flag</text><text x="630" y="35">joint .009</text><text x="630" y="115">joint .001</text><text x="630" y="195">joint .0495</text><text x="630" y="280">joint .9405</text></g></svg>