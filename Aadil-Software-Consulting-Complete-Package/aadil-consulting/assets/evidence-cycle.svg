<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#607762" stroke-width="1.2"/></marker></defs><rect width="1000" height="410" rx="15" fill="#f0f3e9"/><g fill="#fff" stroke="#bdcdbd"><rect x="40" y="52" width="260" height="100" rx="8"/><rect x="370" y="52" width="260" height="100" rx="8"/><rect x="700" y="52" width="260" height="100" rx="8"/><rect x="700" y="250" width="260" height="100" rx="8"/><rect x="370" y="250" width="260" height="100" rx="8"/><rect x="40" y="250" width="260" height="100" rx="8"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#294937"><text x="170" y="94" font-size="20">Decision question</text><text x="170" y="123" font-size="13">What needs to change?</text><text x="500" y="94" font-size="20">Approved evidence</text><text x="500" y="123" font-size="13">Observe the actual workflow</text><text x="830" y="94" font-size="20">Reproduction</text><text x="830" y="123" font-size="13">Test a representative case</text><text x="830" y="292" font-size="20">Findings</text><text x="830" y="321" font-size="13">Separate fact and uncertainty</text><text x="500" y="292" font-size="20">Options</text><text x="500" y="321" font-size="13">Compare feasible choices</text><text x="170" y="292" font-size="20">Recommendation</text><text x="170" y="321" font-size="13">Owner, next step, verification</text></g><g stroke="#607762" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M300 102h62"/><path d="M630 102h62"/><path d="M830 152v90"/><path d="M700 300h-62"/><path d="M370 300h-62"/></g><text x="500" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#607762">An original teaching diagram. Evidence supports a bounded decision; it does not establish universal assurance.</text></svg>
