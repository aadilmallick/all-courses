<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="t d"><title id="t">The physics learning journey</title><desc id="d">Six parts build from measurement and mathematics through mechanics, matter, fields, quantum physics and independent research. Mathematics is introduced alongside the physical questions that need it.</desc><rect width="1080" height="510" rx="18" fill="#eaf0e8"/><text x="45" y="54" font-family="Georgia,serif" font-size="29" fill="#163d4a">One connected journey</text><text x="45" y="84" font-family="system-ui,sans-serif" font-size="16" fill="#52666a">Learn the mathematics when a physical question needs it.</text><path d="M200 210H530H860V370H530H200" stroke="#b9c7bf" stroke-width="6" fill="none"/><g font-family="system-ui,sans-serif"><g transform="translate(45 125)"><rect width="300" height="120" rx="10" fill="#fffdf8"/><text x="20" y="30" font-size="12" fill="#a44c19">01–03 · LANGUAGE</text><text x="20" y="62" font-size="21" fill="#163d4a">Measure and describe</text><text x="20" y="91" font-size="14" fill="#52666a">Algebra → vectors → calculus</text></g><g transform="translate(390 125)"><rect width="300" height="120" rx="10" fill="#fffdf8"/><text x="20" y="30" font-size="12" fill="#a44c19">04–11 · MECHANICS &amp; WAVES</text><text x="20" y="62" font-size="21" fill="#163d4a">Explain motion</text><text x="20" y="91" font-size="14" fill="#52666a">ODEs → complex numbers → action</text></g><g transform="translate(735 125)"><rect width="300" height="120" rx="10" fill="#fffdf8"/><text x="20" y="30" font-size="12" fill="#a44c19">12–14 · MATTER &amp; HEAT</text><text x="20" y="62" font-size="21" fill="#163d4a">From many to macroscopic</text><text x="20" y="91" font-size="14" fill="#52666a">Continuum → entropy → probability</text></g><g transform="translate(735 300)"><rect width="300" height="120" rx="10" fill="#fffdf8"/><text x="20" y="30" font-size="12" fill="#a44c19">15–18 · FIELDS</text><text x="20" y="62" font-size="21" fill="#163d4a">Unify electricity and light</text><text x="20" y="91" font-size="14" fill="#52666a">Vector calculus → boundary problems</text></g><g transform="translate(390 300)"><rect width="300" height="120" rx="10" fill="#fffdf8"/><text x="20" y="30" font-size="12" fill="#a44c19">19–25 · QUANTUM &amp; MODERN</text><text x="20" y="62" font-size="21" fill="#163d4a">Rebuild the microscopic rules</text><text x="20" y="91" font-size="14" fill="#52666a">Linear algebra → operators → tensors</text></g><g transform="translate(45 300)"><rect width="300" height="120" rx="10" fill="#163d4a"/><text x="20" y="30" font-size="12" fill="#edb481">26–28 · INDEPENDENT WORK</text><text x="20" y="62" font-size="21" fill="#fffdf8">Derive, compute, investigate</text><text x="20" y="91" font-size="14" fill="#dbe5df">Graduate tools → numerical &amp; lab judgment</text></g><text x="45" y="473" font-size="14" fill="#52666a">Every stage: explicit assumptions · worked examples · optional problems · checks against limits and evidence</text></g></svg>
