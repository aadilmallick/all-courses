<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">Two voice-agent architectures</title><desc id="desc">A cascade separates recognition, reasoning, and synthesis. A native audio session combines conversational inference. Both need browser capture, playback, and trusted tools.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#7bd9bd"/></marker></defs><rect width="960" height="550" rx="18" fill="#10202d"/><g font-family="sans-serif" text-anchor="middle" fill="#f1f6f8"><text x="240" y="45" font-size="24">Cascaded pipeline</text><text x="720" y="45" font-size="24">Native audio session</text><g fill="#224454" stroke="#6a9da9"><rect x="60" y="75" width="360" height="65" rx="10"/><rect x="60" y="185" width="360" height="65" rx="10"/><rect x="60" y="295" width="360" height="65" rx="10"/><rect x="60" y="405" width="360" height="65" rx="10"/><rect x="540" y="75" width="360" height="65" rx="10"/><rect x="540" y="185" width="360" height="175" rx="10"/><rect x="540" y="405" width="360" height="65" rx="10"/></g><g font-size="19"><text x="240" y="114">Microphone → recognition</text><text x="240" y="224">Text → reasoning + tools</text><text x="240" y="334">Spoken text → synthesis</text><text x="240" y="444">Audio → browser playback</text><text x="720" y="114">Microphone capture</text><text x="720" y="258">Conversational audio model</text><text x="720" y="292">+ trusted backend tools</text><text x="720" y="444">Audio → browser playback</text></g><text x="480" y="515" fill="#b5c8d1" font-size="17">Both paths require turn control, cancellation, authorization, and user-visible state.</text></g><g stroke="#7bd9bd" stroke-width="3" marker-end="url(#arrow)"><path d="M240 145V177"/><path d="M240 255V287"/><path d="M240 365V397"/><path d="M720 145V177"/><path d="M720 365V397"/></g></svg>
