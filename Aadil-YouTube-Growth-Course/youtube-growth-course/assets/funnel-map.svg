<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="title desc"><title id="title">A useful next step at each stage</title><desc id="desc">Engineering video, relevant free checklist, permission to send email, helpful follow-up, suitable paid offer, delivery, then appropriate repeat work or referrals. Each stage allows the person to stop.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3c7664"/></marker></defs><rect width="800" height="660" rx="18" fill="#eef3eb"/><text x="400" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#18352f">Continue the viewer's progress</text><g font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#18352f"><g fill="#fff" stroke="#94b4a5"><rect x="170" y="65" width="460" height="55" rx="8"/><rect x="170" y="145" width="460" height="55" rx="8"/><rect x="170" y="225" width="460" height="55" rx="8"/><rect x="170" y="305" width="460" height="55" rx="8"/><rect x="170" y="385" width="460" height="55" rx="8"/><rect x="170" y="465" width="460" height="55" rx="8"/><rect x="170" y="545" width="460" height="55" rx="8"/></g><text x="400" y="99">A complete, useful engineering video</text><text x="400" y="179">A relevant free checklist</text><text x="400" y="259">Clear permission to send email</text><text x="400" y="339">A worked example and helpful follow-up</text><text x="400" y="419">One suitable paid next step</text><text x="400" y="499">Delivery and customer progress</text><text x="400" y="579">Appropriate repeat work or referral</text></g><g stroke="#3c7664" stroke-width="2" marker-end="url(#arrow)"><path d="M400 121V137"/><path d="M400 201V217"/><path d="M400 281V297"/><path d="M400 361V377"/><path d="M400 441V457"/><path d="M400 521V537"/></g><text x="400" y="633" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#4e6961">A teaching model; real journeys can skip, loop or stop.</text></svg>
